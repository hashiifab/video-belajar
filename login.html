<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Belajar</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a href="#">Video Belajar</a>
    </header>
    <main class="auth-container">
      <div class="auth-card">
        <div class="form-header">
          <h2>Masuk</h2>
          <p>Ayo masuk dulu buat lanjut belajar.</p>
        </div>

        <form class="auth-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" class="input-form" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" class="input-form" />
          </div>
          <a class="forget-password" href="#">Lupa password?</a>

          <a href="index.html" class="login-btn">Masuk</a>
          <a href="register.html" class="register-btn">Daftar</a>

          <p>Atau</p>

          <a href="index.html" class="google-btn">
            <img src="./assets/google.png" alt="google" class="google-icon" />
            Daftar dengan Google</a
          >
        </form>
      </div>
    </main>
  </body>
</html>
